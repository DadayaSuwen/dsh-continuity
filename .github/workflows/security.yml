name: Security
on:
  pull_request:
    paths:
      - src/**
      - tests/security/**
      - scripts/**
      - .github/**
      - package.json
      - pnpm-lock.yaml
      - NOTICE
      - LICENSE
      - SECURITY.md
  push:
    branches: [main]
    paths:
      ['src/**', 'scripts/**', '.github/**', 'package.json', 'pnpm-lock.yaml', 'NOTICE', 'LICENSE']
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Tracked text secret patterns (no live values logged)
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - name: Installed runtime dependency and peer license closure
        run: pnpm check:licenses
      - name: Dependency vulnerabilities (network registry; fail on high)
        run: pnpm audit --audit-level high
      - name: Untrusted upload and import regressions
        run: pnpm exec vitest run tests/security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read-only dependency diff; no PR code execution or comments
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
