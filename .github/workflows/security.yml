name: Security
on:
  pull_request:
    paths:
      - src/**
      - tests/security/**
      - scripts/**
      - .github/**
      - package.json
      - pnpm-lock.yaml
      - NOTICE
      - LICENSE
      - SECURITY.md
  push:
    branches: [main]
    paths:
      ['src/**', 'scripts/**', '.github/**', 'package.json', 'pnpm-lock.yaml', 'NOTICE', 'LICENSE']
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Tracked text secret patterns (no live values logged)
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - name: Installed runtime dependency and peer license closure
        run: pnpm check:licenses
      - name: Published MCP redirects and stdio on synthetic loopback fixtures
        run: pnpm test:mcp
      - name: Dependency vulnerabilities (network registry; fail on high)
        run: pnpm audit --audit-level high
      - name: Untrusted upload and import regressions
        run: pnpm exec vitest run tests/security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read-only dependency diff; no PR code execution or comments
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
