name: Documentation
on:
  pull_request:
    paths:
      - '**/*.md'
      - examples/**
      - schemas/**
      - cordis.patch.yml
      - src/plugin.ts
      - scripts/check-docs.mjs
      - scripts/quality/**
      - .github/**
      - package.json
  push:
    branches: [main]
    paths: ['**/*.md', 'examples/**', 'schemas/**', 'scripts/check-docs.mjs', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Local links, bilingual structure, actual config and workflow scripts
        run: node scripts/check-docs.mjs
      - name: Quality self-check
        run: node scripts/quality/self-test.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docs-evidence
          path: test-results/docs.json
          if-no-files-found: error
          retention-days: 7
