name: Documentation
on:
  pull_request:
    paths:
      - '**/*.md'
      - examples/**
      - schemas/**
      - cordis.patch.yml
      - src/plugin.ts
      - scripts/check-docs.mjs
      - scripts/quality/**
      - .github/**
      - package.json
  push:
    branches: [main]
    paths: ['**/*.md', 'examples/**', 'schemas/**', 'scripts/check-docs.mjs', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Local links, bilingual structure, actual config and workflow scripts
        run: node scripts/check-docs.mjs
      - name: Quality self-check
        run: node scripts/quality/self-test.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-evidence
          path: test-results/docs.json
          if-no-files-found: error
          retention-days: 7
