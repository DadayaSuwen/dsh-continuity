name: DSH compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'
  pull_request:
    paths:
      - src/**
      - tests/**
      - package.json
      - pnpm-lock.yaml
      - COMPATIBILITY.json
      - scripts/test-pinned.mjs
      - scripts/check-compatibility.mjs
      - scripts/upstream-compatibility.mjs
      - scripts/quality/**
      - vitest.pinned.config.ts
      - .github/workflows/dsh-compatibility.yml
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact audited official source checkout (read only)
        run: node scripts/quality/clone-pinned.mjs
      - name: npm contract and source identity evidence are distinct
        run: pnpm check:compatibility
      - name: Actual audited source aliases and production runtime
        run: pnpm test:pinned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pinned-compatibility-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  upstream-latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stable source for API/source diff (pin remains unchanged)
        run: node scripts/quality/clone-pinned.mjs
      - name: Latest master in ignored .test/results then real test-pinned
        run: node scripts/upstream-compatibility.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: upstream-compatibility-evidence
          path: |
            test-results/upstream-compatibility.*
            test-results/pinned-compatibility.json
            test-results/pinned-junit.xml
          if-no-files-found: error
          retention-days: 30
  maintenance-issue:
    needs: upstream-latest
    if: always() && needs.upstream-latest.result == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or comment a single maintenance issue, never modify stable pin
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = '[compatibility] Latest DSH source/runtime check failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open' });
            const body = `Latest official master probe failed. Stable pin was not modified. API/source diff and real source-alias test evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
