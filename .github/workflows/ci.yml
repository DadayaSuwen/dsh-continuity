name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - scripts/**
      - .github/**
      - '**/*.md'
      - package.json
      - pnpm-lock.yaml
      - COMPATIBILITY.json
      - cordis.patch.yml
      - '*config*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Required status and conservative cost filter
        id: paths
        run: node scripts/quality/changed-paths.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Quality module self-check
        run: node scripts/quality/self-test.mjs
      - name: Local docs, config and workflow contract
        run: node scripts/check-docs.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.paths.outputs.code == 'true'
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.paths.outputs.code == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Frozen installation
        if: steps.paths.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint and formatting
        if: steps.paths.outputs.code == 'true'
        run: pnpm typecheck && pnpm lint && pnpm format:check
      - name: Unit, upload security and real-storage integration
        if: steps.paths.outputs.code == 'true'
        run: pnpm test:unit && pnpm test:integration
      - name: Production build and exact npm contract
        if: steps.paths.outputs.code == 'true'
        run: pnpm build && pnpm check:compatibility
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7
