name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - scripts/**
      - .github/**
      - '**/*.md'
      - package.json
      - pnpm-lock.yaml
      - COMPATIBILITY.json
      - cordis.patch.yml
      - '*config*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Required status and conservative cost filter
        id: paths
        run: node scripts/quality/changed-paths.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Quality module self-check
        run: node scripts/quality/self-test.mjs
      - name: Local docs, config and workflow contract
        run: node scripts/check-docs.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.paths.outputs.code == 'true'
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.paths.outputs.code == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Frozen installation
        if: steps.paths.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint and formatting
        if: steps.paths.outputs.code == 'true'
        run: pnpm typecheck && pnpm lint && pnpm format:check
      - name: Unit, upload security and real-storage integration
        if: steps.paths.outputs.code == 'true'
        run: pnpm test:unit && pnpm test:integration
      - name: Production build and exact npm contract
        if: steps.paths.outputs.code == 'true'
        run: pnpm build && pnpm check:compatibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7
