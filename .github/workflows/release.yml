name: Release preparation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact existing vVERSION tag matching package.json; preparation only
        type: string
        required: true
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-preparation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      version: ${{ steps.exact.outputs.version }}
      tag: ${{ steps.exact.outputs.tag }}
      sha: ${{ steps.exact.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Exact semver/tag/commit, main ancestry and duplicate read-only checks
        id: exact
        run: node scripts/quality/release-preflight.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Require out-of-band HUMAN environment protection configuration
        run: node -e "if (process.env.RELEASE_HUMAN_APPROVAL_CONFIGURED !== 'true') process.exit(1)"
        env:
          RELEASE_HUMAN_APPROVAL_CONFIGURED: ${{ vars.RELEASE_HUMAN_APPROVAL_CONFIGURED }}
      - name: Recheck duplicate/version state after HUMAN environment review
        run: node scripts/quality/release-preflight.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - name: Stdlib quality, type/lint/docs/license/secret contracts
        run: node scripts/quality/self-test.mjs && pnpm typecheck && pnpm lint && pnpm format:check && pnpm check:docs && pnpm check:licenses && node scripts/check-secrets.mjs
      - name: Block preparation on high dependency advisories
        run: pnpm audit --audit-level high
      - run: node scripts/quality/clone-pinned.mjs
      - run: pnpm check:compatibility
      - name: Audited SHA real source tests
        run: pnpm test:pinned
      - name: Published npm real runtime tests
        run: pnpm test && pnpm test:runtime
      - name: Actual packed bytes, isolated official peers and native Loader entry
        run: node scripts/packed-smoke.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:mobile
      - name: Local npm artifact and GitHub Release draft preparation ONLY
        run: node scripts/quality/release-prepare.mjs
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_HUMAN_APPROVAL_CONFIGURED: ${{ vars.RELEASE_HUMAN_APPROVAL_CONFIGURED }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-preparation-${{ needs.preflight.outputs.version }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30
# HUMAN required reviewers, prevent-self-review, no administrator bypass and
# main/v* deployment rules must be configured by a maintainer after confirmation.
# No publishing secret, npm publish, GitHub Release API write or contents:write.
# A separately approved change is required for any future public publication.
