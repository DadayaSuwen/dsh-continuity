name: Runtime and mobile E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/e2e/**
      - tests/helpers/**
      - tests/fixtures/**
      - package.json
      - pnpm-lock.yaml
      - scripts/build.mjs
      - scripts/packed-smoke.mjs
      - scripts/quality/**
      - playwright.config.ts
      - cordis.patch.yml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths: ['src/**', 'tests/e2e/**', 'scripts/packed-smoke.mjs', 'package.json', 'pnpm-lock.yaml']
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack bytes, isolated official peers, native Loader and entry
        run: node scripts/packed-smoke.mjs
      - name: Real Cordis, storage, official import and production AgentLoop
        run: pnpm test:runtime
      - name: Install only Chromium for declared mobile views
        run: pnpm exec playwright install --with-deps chromium
      - name: Native DSH mobile workflow
        run: pnpm test:mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-mobile-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
