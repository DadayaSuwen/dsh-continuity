name: Runtime and mobile E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/e2e/**
      - tests/helpers/**
      - tests/fixtures/**
      - package.json
      - pnpm-lock.yaml
      - scripts/build.mjs
      - scripts/packed-smoke.mjs
      - scripts/source-smoke.mjs
      - scripts/check-import-interruption.mjs
      - scripts/measure-resources.mjs
      - scripts/quality/**
      - playwright.config.ts
      - cordis.patch.yml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      [
        'src/**',
        'tests/e2e/**',
        'tests/helpers/**',
        'tests/fixtures/**',
        'scripts/packed-smoke.mjs',
        'scripts/source-smoke.mjs',
        'scripts/check-import-interruption.mjs',
        'scripts/measure-resources.mjs',
        'package.json',
        'pnpm-lock.yaml',
      ]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack bytes, isolated official peers, native Loader and entry
        run: pnpm test:packed
      - name: Real Cordis, storage, official import and production AgentLoop
        run: pnpm test:runtime
      - name: Durable import hard-stop and restart checkpoints
        run: pnpm test:interruption
      - name: Bounded synthetic preview measurements (not RSS ceiling acceptance)
        run: pnpm test:resources -- --repeat=2
      - name: Current HEAD source ZIP in a fresh no-Git consumer
        run: |
          node -e "const p=require('./package.json');require('node:child_process').execFileSync('git',['archive','--format=zip','--prefix='+p.name+'-'+p.version+'/','--output=test-results/source-ci.zip','HEAD'])"
          pnpm test:source -- test-results/source-ci.zip
      - name: Install only Chromium for declared mobile views
        run: pnpm exec playwright install --with-deps chromium
      - name: Native DSH mobile workflow
        run: pnpm test:mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-mobile-evidence
          include-hidden-files: true
          path: |
            test-results/
            .runtime/round-3/resource-*/results.json
            playwright-report/
          if-no-files-found: error
          retention-days: 14
