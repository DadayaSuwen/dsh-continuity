name: Test matrix
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/**
      - package.json
      - pnpm-lock.yaml
      - scripts/build.mjs
      - scripts/check-compatibility.mjs
      - scripts/quality/**
      - vitest.config.ts
      - .github/workflows/test-matrix.yml
      - COMPATIBILITY.json
permissions:
  contents: read
concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tested-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.22.3']
        dsh: ['0.2.2-rc.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact published npm version contract, not a SHA test
        run: pnpm check:compatibility
        env:
          EXPECTED_DSH_VERSION: ${{ matrix.dsh }}
      - run: node scripts/quality/self-test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: matrix-${{ matrix.os }}-node${{ matrix.node }}-npm${{ matrix.dsh }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7
