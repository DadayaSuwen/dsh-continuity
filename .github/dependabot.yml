version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      quality-tooling:
        patterns: ['eslint*', 'typescript-eslint', 'prettier', '@types/*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@deepseek-ai/*'
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      action-pins:
        patterns: ['*']
# Dependabot opens reviewable PRs only. No auto-merge. Official DSH upgrades must
# update the audited exact SHA/npm contract with separate source/runtime evidence.
